<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ID CARD SMKN 2 Banjarmasin</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #d8e6f7;
        padding: 24px;
      }

      /* 324 x 204 (SVG acuan) diskala 3x = 972 x 612 */
      .student-card {
        position: relative;
        width: 972px;
        height: 612px;
        overflow: hidden;
        border-radius: 24px;
        background: #ffffff;
      }

      /* Latar hijau (lengkung atas + ombak bawah) + motif persis SVG acuan */
      .card-bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      .card-content {
        position: absolute;
        inset: 0;
        z-index: 2;
      }

      .school-logo {
        position: absolute;
        top: 21px;
        left: 261px;
        width: 72px;
        height: 69px;
      }

      .school-logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .school-title {
        position: absolute;
        top: 32px;
        left: 348px;
        white-space: nowrap;
      }

      .school-title h1 {
        color: #ffffff;
        font-size: 30px;
        font-weight: 800;
        line-height: 1.15;
        letter-spacing: 0.5px;
      }

      .kartu-title {
        position: absolute;
        top: 164px;
        left: 0;
        right: 0;
        text-align: center;
        color: #111111;
        font-size: 34px;
        font-weight: 800;
        line-height: 1.2;
      }

      .student-photo {
        position: absolute;
        top: 225px;
        left: 48px;
        width: 240px;
        height: 300px;
        background: #d7e9ff;
        border-radius: 24px;
        box-shadow: 0 6px 6px rgba(0, 0, 0, 0.25);
      }

      .student-photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 24px;
        border: 6px solid #f1f1f1;
        background: #d7e9ff;
      }

      .student-name {
        position: absolute;
        top: 266px;
        left: 303px;
        width: 300px;
        color: #111111;
        font-size: 20px;
        font-weight: 700;
        line-height: 1.25;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .meta-rule {
        position: absolute;
        left: 303px;
        width: 300px;
        height: 1px;
        background: #000000;
      }

      .meta-rule.rule-1 {
        top: 315px;
      }

      .meta-rule.rule-2 {
        top: 378px;
      }

      .meta-row {
        position: absolute;
        left: 303px;
        width: 300px;
        display: flex;
        align-items: baseline;
        gap: 12px;
        color: #111111;
        font-size: 16px;
        font-weight: 400;
        white-space: nowrap;
      }

      .meta-row.jurusan {
        top: 334px;
      }

      .meta-row.nisn {
        top: 394px;
      }

      .meta-label {
        min-width: 62px;
      }

      .meta-sep {
        min-width: 8px;
        text-align: center;
      }

      .meta-value {
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .qr-box {
        position: absolute;
        top: 253px;
        left: 667px;
        width: 255px;
        height: 261px;
        padding: 16px 19px 17px 20px;
        background: #ffffff;
        border: 3px solid #000000;
        border-radius: 22px;
      }

      .qr-box img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      @media print {
        body {
          background: #ffffff;
          padding: 0;
        }
      }

      @media (max-width: 940px) {
        .student-card {
          transform: scale(0.78);
        }
      }

      @media (max-width: 720px) {
        body {
          align-items: flex-start;
          padding: 12px;
        }

        .student-card {
          transform: scale(0.56);
          transform-origin: top center;
        }
      }
    </style>
  </head>
  <body>
    <main class="student-card">
      <svg
        class="card-bg"
        viewBox="0 0 324 204"
        preserveAspectRatio="xMidYMid meet"
        aria-hidden="true"
      >
        <defs>
          <pattern
            id="motifPat"
            patternUnits="userSpaceOnUse"
            width="204"
            height="324"
          >
            <image
              href="__MOTIF_DATA__"
              width="204"
              height="324"
              preserveAspectRatio="none"
            />
          </pattern>
          <linearGradient
            id="archOuter"
            x1="-23"
            y1="-1"
            x2="347"
            y2="-1"
            gradientUnits="userSpaceOnUse"
          >
            <stop offset="0.490385" stop-color="#0DC425" />
            <stop offset="1" stop-color="#065E0C" />
          </linearGradient>
          <linearGradient
            id="archInner"
            x1="-23"
            y1="-6"
            x2="347"
            y2="-6"
            gradientUnits="userSpaceOnUse"
          >
            <stop stop-color="#0DC425" />
            <stop offset="0.25" stop-color="#065E0C" />
            <stop offset="0.75" stop-color="#065E0C" />
            <stop offset="1" stop-color="#0DC425" />
          </linearGradient>
          <linearGradient
            id="waveGrad"
            x1="347"
            y1="171.07"
            x2="-23"
            y2="171.07"
            gradientUnits="userSpaceOnUse"
          >
            <stop offset="0.490385" stop-color="#0DC425" />
            <stop offset="1" stop-color="#065E0C" />
          </linearGradient>
          <clipPath id="cardClip">
            <rect width="324" height="204" rx="8" fill="white" />
          </clipPath>
        </defs>
        <g clip-path="url(#cardClip)">
          <rect width="324" height="204" rx="8" fill="white" />
          <rect
            opacity="0.2"
            y="204"
            width="204"
            height="324"
            transform="rotate(-90 0 204)"
            fill="url(#motifPat)"
          />
          <ellipse
            cx="162"
            cy="-1"
            rx="185"
            ry="50"
            fill="url(#archOuter)"
          />
          <ellipse
            cx="162"
            cy="-6"
            rx="185"
            ry="50"
            fill="url(#archInner)"
          />
          <path
            d="M-23 185C-23 157.386 59.8273 195.57 162 195.57C264.173 195.57 347 157.386 347 185C347 212.614 264.173 221.07 162 221.07C59.8273 221.07 -23 212.614 -23 185Z"
            fill="url(#waveGrad)"
          />
          <path
            d="M-25.5 190.5C-25.5 162.886 59.8273 199.57 162 199.57C264.173 199.57 347 162.886 347 190.5C347 218.114 264.173 225.07 162 225.07C59.8273 225.07 -25.5 218.114 -25.5 190.5Z"
            fill="#065E0C"
          />
        </g>
      </svg>

      <section class="card-content">
        <div class="school-logo">
          <img src="__LOGO__" alt="Logo SMKN 2 Banjarmasin" />
        </div>

        <div class="school-title">
          <h1>SMKN 2 Banjarmasin</h1>
        </div>

        <div class="kartu-title">Kartu Pelajar</div>

        <aside class="student-photo">
          <img src="__PHOTO__" alt="Foto Murid" />
        </aside>

        <div class="student-name">__STUDENT_NAME__</div>
        <span style="display: none">__JURUSAN__</span>
        <div class="meta-rule rule-1"></div>

        <div class="meta-row jurusan">
          <span class="meta-label">Jurusan</span>
          <span class="meta-sep">:</span>
          <span class="meta-value">__KELAS__</span>
        </div>
        <div class="meta-rule rule-2"></div>

        <div class="meta-row nisn">
          <span class="meta-label">NISN</span>
          <span class="meta-sep">:</span>
          <span class="meta-value">__NISN__</span>
        </div>

        <div class="qr-box">
          <img src="__QR__" alt="QR Code Murid" />
        </div>
      </section>
    </main>
  </body>
</html>
