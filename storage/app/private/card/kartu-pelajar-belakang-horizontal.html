<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ID CARD SMKN 2 Banjarmasin - Belakang</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #d8e6f7;
        padding: 24px;
      }

      /* 324 x 204 (SVG acuan) diskala 3x = 972 x 612 */
      .student-card {
        position: relative;
        width: 972px;
        height: 612px;
        overflow: hidden;
        border-radius: 24px;
        background: #ffffff;
      }

      /* Latar hijau (lengkung atas + ombak bawah) + motif persis SVG acuan */
      .card-bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      .card-content {
        position: absolute;
        inset: 0;
        z-index: 2;
      }

      .school-logo {
        position: absolute;
        top: 225px;
        left: 418px;
        width: 135px;
        height: 132px;
      }

      .school-logo img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .school-name {
        position: absolute;
        top: 380px;
        left: 0;
        right: 0;
        text-align: center;
        color: #111111;
        font-size: 34px;
        font-weight: 800;
        line-height: 1.2;
        white-space: nowrap;
      }

      .school-address {
        position: absolute;
        top: 443px;
        left: 0;
        right: 0;
        text-align: center;
        color: #111111;
        font-size: 12px;
        font-weight: 400;
        letter-spacing: 0.3px;
        white-space: nowrap;
      }

      @media print {
        body {
          background: #ffffff;
          padding: 0;
        }
      }

      @media (max-width: 940px) {
        .student-card {
          transform: scale(0.78);
        }
      }

      @media (max-width: 720px) {
        body {
          align-items: flex-start;
          padding: 12px;
        }

        .student-card {
          transform: scale(0.56);
          transform-origin: top center;
        }
      }
    </style>
  </head>
  <body>
    <main class="student-card">
      <svg
        class="card-bg"
        viewBox="0 0 324 204"
        preserveAspectRatio="xMidYMid meet"
        aria-hidden="true"
      >
        <defs>
          <pattern
            id="motifPat"
            patternUnits="userSpaceOnUse"
            width="204"
            height="324"
          >
            <image
              href="__MOTIF_DATA__"
              width="204"
              height="324"
              preserveAspectRatio="none"
            />
          </pattern>
          <linearGradient
            id="archOuter"
            x1="-23"
            y1="-1"
            x2="347"
            y2="-1"
            gradientUnits="userSpaceOnUse"
          >
            <stop offset="0.490385" stop-color="#0DC425" />
            <stop offset="1" stop-color="#065E0C" />
          </linearGradient>
          <linearGradient
            id="archInner"
            x1="-23"
            y1="-6"
            x2="347"
            y2="-6"
            gradientUnits="userSpaceOnUse"
          >
            <stop stop-color="#0DC425" />
            <stop offset="0.25" stop-color="#065E0C" />
            <stop offset="0.75" stop-color="#065E0C" />
            <stop offset="1" stop-color="#0DC425" />
          </linearGradient>
          <linearGradient
            id="waveGrad"
            x1="347"
            y1="171.07"
            x2="-23"
            y2="171.07"
            gradientUnits="userSpaceOnUse"
          >
            <stop offset="0.490385" stop-color="#0DC425" />
            <stop offset="1" stop-color="#065E0C" />
          </linearGradient>
          <clipPath id="cardClip">
            <rect width="324" height="204" rx="8" fill="white" />
          </clipPath>
        </defs>
        <g clip-path="url(#cardClip)">
          <rect width="324" height="204" rx="8" fill="white" />
          <rect
            opacity="0.4"
            y="204"
            width="204"
            height="324"
            transform="rotate(-90 0 204)"
            fill="url(#motifPat)"
          />
          <ellipse
            cx="162"
            cy="-1"
            rx="185"
            ry="50"
            fill="url(#archOuter)"
          />
          <ellipse
            cx="162"
            cy="-6"
            rx="185"
            ry="50"
            fill="url(#archInner)"
          />
          <path
            d="M-23 185C-23 157.386 59.8273 195.57 162 195.57C264.173 195.57 347 157.386 347 185C347 212.614 264.173 221.07 162 221.07C59.8273 221.07 -23 212.614 -23 185Z"
            fill="url(#waveGrad)"
          />
          <path
            d="M-25.5 190.5C-25.5 162.886 59.8273 199.57 162 199.57C264.173 199.57 347 162.886 347 190.5C347 218.114 264.173 225.07 162 225.07C59.8273 225.07 -25.5 218.114 -25.5 190.5Z"
            fill="#065E0C"
          />
        </g>
      </svg>

      <section class="card-content">
        <div class="school-logo">
          <img src="__LOGO__" alt="Logo SMKN 2 Banjarmasin" />
        </div>

        <div class="school-name">SMKN 2 Banjarmasin</div>

        <div class="school-address">
          JL. BRIGJEND H. HASAN BASRI NO.6. BANJARMASIN - KALIMANTAN SELATAN 70123
        </div>
      </section>
    </main>
  </body>
</html>
